    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Farhan Ali Haider",
        "alternateName": "Bangash",
        "jobTitle": "Mobile app developer",
        "url": "https://farhan-bangash.vercel.app/",
        "image": "https://farhan-bangash.vercel.app/og-image.png",
        "sameAs": ["https://github.com/bangash40"]
      }
    </script>

    <!-- Apply the saved or system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        // Dark is the default experience until the visitor chooses light.
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        document.documentElement.dataset.theme = theme;
        // Any path but '/' gets the prerendered home HTML via the Vercel rewrite; hide it
        // until main.tsx swaps in the 404 page.
        if (location.pathname !== '/') document.documentElement.classList.add('not-found');
      })();
    </script>

    <!-- Boot sequence: decide before the first paint so the CSS animation starts with the page.
         Once per session, home page only, never with reduced motion (DESIGN.md §7.1). -->
    <script>
      (function () {
        try {
          if (
            location.pathname === '/' &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
            sessionStorage.getItem('booted') === null
          ) {
            sessionStorage.setItem('booted', '1');
            document.documentElement.classList.add('booting');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; metric-matched fallbacks in index.css keep
         the layout steady when they swap in. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    /></noscript>
