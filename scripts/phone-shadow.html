<!doctype html>
<!-- Source for public/phone-shadow.png: the phone's DESIGN.md shadow
     (0 40px 80px -20px rgb(29 35 48 / 0.35) on a 300 x 621 body with 52px radius), drawn once
     at half scale. PhoneFrame shows it as an image because live 80px blurs are very slow to
     paint without a GPU. Regenerate with `npm run images`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 210px;
        height: 371px;
        overflow: hidden;
        background: transparent;
      }
      /* Half scale: canvas = phone (150 x 310.5) plus the blur's reach (30px sides, 10px top,
         50px bottom). Spread, offset and blur are halved too. */
      .phone {
        position: absolute;
        left: 30px;
        top: 10px;
        width: 150px;
        height: 310.5px;
        border-radius: 26px;
        box-shadow: 0 20px 40px -10px rgb(29 35 48 / 0.35);
      }
    </style>
  </head>
  <body>
    <div class="phone"></div>
  </body>
</html>
