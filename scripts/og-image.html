<!doctype html>
<!-- Source for public/og-image.png (1200 x 630, DESIGN.md §9). Regenerate with
     `node scripts/render-images.mjs`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@500&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #edeff2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 96px;
      }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 800;
        font-size: 112px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        color: #1d2330;
      }
      p {
        margin-top: 36px;
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 500;
        font-size: 30px;
        color: #5b6475;
      }
      .phone {
        position: relative;
        width: 250px;
        height: 520px;
        border-radius: 46px;
        background: #1d2330;
        box-shadow: 0 40px 80px -20px rgb(29 35 48 / 0.35);
        padding: 9px;
      }
      .screen {
        position: relative;
        height: 100%;
        border-radius: 37px;
        background: #07090d;
        background-image: linear-gradient(
          135deg,
          rgb(255 255 255 / 0.06),
          rgb(255 255 255 / 0) 55%
        );
      }
      .island {
        position: absolute;
        top: 14px;
        left: 50%;
        width: 78px;
        height: 22px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #000;
      }
      .led {
        position: absolute;
        top: 3px;
        right: 30%;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #f0a202;
        box-shadow: 0 0 6px 1px #f0a202;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Farhan<br />Ali Haider</h1>
      <p>farhan-bangash.vercel.app</p>
    </div>
    <div class="phone">
      <span class="led"></span>
      <div class="screen"><span class="island"></span></div>
    </div>
  </body>
</html>
