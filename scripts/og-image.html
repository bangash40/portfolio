<!doctype html>
<!-- Source for public/og-image.png (1200 x 630, DESIGN.md §9). Regenerate with
     `node scripts/render-images.mjs`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@500&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0e1013;
        color: #edeef0;
        font-family: 'Geist', sans-serif;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 90px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(237 238 240 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(237 238 240 / 0.045) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 80% 80% at 60% 40%, #000 30%, transparent 85%);
      }
      .spot {
        position: absolute;
        top: -300px;
        right: -200px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(124 139 255 / 0.16) 0%, transparent 65%);
      }
      .text {
        position: relative;
        max-width: 640px;
      }
      .badge {
        display: inline-flex;
        padding: 8px 14px;
        border-radius: 9px;
        border: 1px solid rgb(124 139 255 / 0.45);
        background: rgb(124 139 255 / 0.13);
        color: #7c8bff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.08em;
      }
      h1 {
        margin-top: 30px;
        font-size: 74px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.04em;
      }
      h1 span {
        color: #7c8bff;
      }
      .name {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 600;
      }
      .name small {
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        font-weight: 500;
        color: #9ba1ad;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #7c8bff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone {
        position: relative;
        width: 270px;
        height: 560px;
        border-radius: 46px;
        background: #060709;
        box-shadow:
          0 0 0 1px #363b46,
          0 40px 90px -30px rgb(0 0 0 / 0.9);
        padding: 9px;
      }
      .screen {
        position: relative;
        height: 100%;
        border-radius: 38px;
        background: #121418;
        padding: 58px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .island {
        position: absolute;
        top: 12px;
        left: 50%;
        width: 84px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #000;
      }
      .muted {
        font-size: 13px;
        color: #9ba1ad;
      }
      .title {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .progress {
        border-radius: 18px;
        background: #7c8bff;
        height: 92px;
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 18px 18px 18px 104px;
        position: relative;
      }
      .progress::before {
        content: '';
        position: absolute;
        left: 18px;
        top: 18px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 6px solid rgb(14 16 19 / 0.25);
        border-top-color: #0e1013;
        border-right-color: #0e1013;
        box-sizing: border-box;
      }
      .progress i {
        flex: 1;
        border-radius: 3px;
        background: rgb(14 16 19 / 0.45);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid #262a33;
        background: #16191e;
      }
      .row b {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        border: 2px solid #363b46;
      }
      .row b.done {
        border-color: #7c8bff;
        background: #7c8bff;
      }
      .row span {
        height: 7px;
        border-radius: 4px;
        background: #edeef0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="spot"></div>
    <div class="text">
      <span class="badge">FLUTTER DEVELOPER • MOBILE ENGINEER</span>
      <h1>Mobile apps, engineered to <span>feel effortless.</span></h1>
      <div class="name">
        <span class="logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0e1013" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v5M12 9l-6 5M12 9l6 5M6 14v5M18 14v5" />
          </svg>
        </span>
        Farhan Ali Haider <small>farhan-bangash.vercel.app</small>
      </div>
    </div>
    <div class="phone">
      <div class="screen">
        <span class="island"></span>
        <div>
          <p class="muted">Good morning</p>
          <p class="title">Your tasks</p>
        </div>
        <div class="progress">
          <i style="height: 40%"></i><i style="height: 70%"></i><i style="height: 55%"></i
          ><i style="height: 100%; background: #0e1013"></i><i style="height: 75%"></i>
        </div>
        <div class="row"><b class="done"></b><span style="width: 62%"></span></div>
        <div class="row"><b class="done"></b><span style="width: 50%"></span></div>
        <div class="row"><b></b><span style="width: 58%"></span></div>
        <div class="row"><b></b><span style="width: 44%"></span></div>
      </div>
    </div>
  </body>
</html>
